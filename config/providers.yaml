# Precios en USD por 1M de tokens. VERIFICAR contra las páginas oficiales
# antes de la entrega y actualizar la fecha.
# Actualizado: 2026-11-25 (Anthropic verificado contra la tabla oficial de precios)
#
# Cada proveedor puede tener varios modelos; se eligen con --model <clave>.
# temperature: null  -> no se envía. Anthropic la rechaza en todos los modelos
#                       desde la versión de API 2026-10-21 (heredado de M1, ADR-016).
# effort:             -> solo modelos que piensan. low|medium|high|xhigh|max.
#
# El proveedor por defecto es mock para que un clon limpio corra sin claves (ADR-012).
default_provider: mock

# Qué modelo cumple cada rol cuando no se indica otro por línea de comandos.
roles:
  generation: {provider: anthropic, model: default}     # Haiku 5.5
  judge: {provider: anthropic, model: sonnet-5-5}       # más capaz que el generador (ADR-043)

providers:
  anthropic:
    models:
      default:
        id: claude-haiku-5-5      # generador: barato y rápido; piensa por defecto
        temperature: null
        effort: low               # respuesta corta sobre 3 chunks: poco razonamiento
        max_tokens: 3000          # el thinking consume max_tokens
        pricing:                  # tarifa para prompts <= 100K tokens
          input_per_1m_usd: 0.10
          output_per_1m_usd: 0.50
      sonnet-5-5:
        id: claude-sonnet-5-5     # juez de groundedness
        temperature: null
        effort: medium
        max_tokens: 6000
        pricing:
          input_per_1m_usd: 2.00
          output_per_1m_usd: 10.00

  openai:
    models:
      default:
        id: gpt-4.1-mini          # alternativa; acepta temperature. Precio a verificar
        temperature: 0.0
        max_tokens: 1500
        pricing:
          input_per_1m_usd: 0.40
          output_per_1m_usd: 1.60

  mock:
    models:
      default:
        id: mock-extractive       # sin red: arma la respuesta copiando el mejor chunk
        temperature: null
        max_tokens: 1500
        pricing:
          input_per_1m_usd: 0.0
          output_per_1m_usd: 0.0
